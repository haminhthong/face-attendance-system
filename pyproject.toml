[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance-system"
version = "1.0.0"
description = "Student attendance system using face recognition, WebRTC and SQLite"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "streamlit-webrtc>=0.47,<1",
  "av>=12,<16",
  "opencv-python-headless>=4.10,<5",
  "face-recognition>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
